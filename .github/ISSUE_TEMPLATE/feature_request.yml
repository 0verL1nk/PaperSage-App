name: 功能建议
description: 提出一个新功能或改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述使用场景与当前的阻碍，而不是直接给实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 你希望用户看到什么、怎么操作。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 前端界面
        - 后端 API
        - LaTeX 编译
        - AI 写作辅助
        - 桌面端
        - 文档
        - 不确定
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
