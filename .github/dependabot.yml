# 依赖自动更新：minor/patch 分组提 PR，major 单独提（可能有破坏性变更）
version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
      day: monday
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci(deps)

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
