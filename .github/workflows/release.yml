name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      rollback_version:
        description: 'Existing server release to restore (vMAJOR.MINOR.PATCH)'
        required: true
        type: string

permissions:
  contents: read
  checks: read

# 同一 tag 只允许一个发布流程；不取消已开始的部署，避免半途中断。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate immutable release source
        id: source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require green CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.source.outputs.commit }}
        run: |
          # 发布不再重复跑整套 CI：tag 必须指向 main 上 CI 已完成的提交。
          # 只检查该提交实际产生的 check-runs（CI 按路径过滤，未改动的域不会跑）。
          # 排除当前发布流程自己的 job，避免等待自身造成死锁。
          deadline=$((SECONDS + 900))
          while :; do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" \
              --jq '.check_runs[]
                | select(.app.slug == "github-actions")
                | select(.name | IN("validate", "release", "deploy", "rollback") | not)
                | [.name, (.conclusion // .status), .started_at] | @tsv' \
              > checks.tsv
            # 同名 check 取最新一次（重跑会追加记录）。
            sort -t$'\t' -k1,1 -k3,3 checks.tsv | awk -F'\t' '{latest[$1]=$2} END {for (n in latest) print n"\t"latest[n]}' > latest.tsv
            bad=$(awk -F'\t' '$2 != "success" && $2 != "skipped" && $2 != "neutral" && $2 != "queued" && $2 != "in_progress" && $2 != "waiting" && $2 != "requested" {print $1" ("$2")"}' latest.tsv)
            pending=$(awk -F'\t' '$2 == "queued" || $2 == "in_progress" || $2 == "waiting" || $2 == "requested" {print $1}' latest.tsv)
            success=$(awk -F'\t' '$2 == "success" {n++} END {print n+0}' latest.tsv)
            if [ -n "$bad" ]; then
              echo "::error::failing checks for $SHA: $bad"
              exit 1
            fi
            if [ -z "$pending" ] && [ "$success" -gt 0 ]; then
              echo "all $success completed checks are green for $SHA"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::timed out waiting for CI on $SHA; cut the tag after main CI completes"
              exit 1
            fi
            echo "waiting for CI on $SHA..."
            sleep 20
          done

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-amd64-${{ needs.validate.outputs.commit }}
          path: |
            dist/papersage_*_linux_amd64.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [validate, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-server
    concurrency:
      group: papersage-production-server
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: server-linux-amd64-${{ needs.validate.outputs.commit }}
          path: bundle
      - name: Verify release archive
        id: bundle
        working-directory: bundle
        run: |
          file="papersage_${RELEASE_TAG#v}_linux_amd64.tar.gz"
          test -f "$file"
          sha256sum --check --ignore-missing checksums.txt
          digest=$(sha256sum "$file")
          echo "checksum=${digest%% *}" >> "$GITHUB_OUTPUT"
      - name: Deploy verified binaries
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          ARCHIVE_CHECKSUM: ${{ steps.bundle.outputs.checksum }}
        run: |
          [[ "$SERVER_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$SERVER_USER" =~ ^[a-z_][a-z0-9_-]*$ && "$SERVER_USER" != root ]]
          test -n "$SERVER_SSH_KEY"
          test -n "$SERVER_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/papersage_deploy"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SERVER_SSH_KEY" > "$key"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$key" "$HOME/.ssh/known_hosts"
          options=(-i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          remote="$SERVER_USER@$SERVER_HOST"
          scp -C "${options[@]}" "bundle/papersage_${RELEASE_TAG#v}_linux_amd64.tar.gz" \
            "$remote:/var/lib/papersage-deploy/uploads/$RELEASE_TAG-$RELEASE_COMMIT.tar.gz"
          ssh "${options[@]}" "$remote" \
            "sudo -n /usr/local/sbin/papersage-release activate '$RELEASE_TAG' '$RELEASE_COMMIT' '$ARCHIVE_CHECKSUM'"

  rollback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-server
    concurrency:
      group: papersage-production-server
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.rollback_version }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
    steps:
      - name: Restore an existing server release
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SERVER_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$SERVER_USER" =~ ^[a-z_][a-z0-9_-]*$ && "$SERVER_USER" != root ]]
          test -n "$SERVER_SSH_KEY"
          test -n "$SERVER_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/papersage_deploy"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SERVER_SSH_KEY" > "$key"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$key" "$HOME/.ssh/known_hosts"
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SERVER_USER@$SERVER_HOST" "sudo -n /usr/local/sbin/papersage-release rollback '$RELEASE_TAG'"
