name: Frontend CI

on:
  workflow_call:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Run lint
        working-directory: frontend
        run: pnpm lint

  # 生产构建 + 产物体积预算：此前 CI 从不调用 `pnpm build`，构建断裂要到
  # 发布/Vercel 才暴露；体积上限写进 frontend/.size-limit.json，上调必须出现在 PR diff。
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Production build
        working-directory: frontend
        run: pnpm build

      - name: Bundle size budget
        working-directory: frontend
        run: pnpm exec size-limit

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        working-directory: frontend
        run: pnpm test:coverage

      # 覆盖率摘要进 Step Summary：零成本，不引 Codecov 之类的第三方 SaaS。
      - name: Coverage summary
        if: always()
        working-directory: frontend
        run: |
          # shellcheck disable=SC2016 # 单引号里是 JS 模板字符串，故意不让 shell 展开
          node -e '
            const fs = require("node:fs");
            const path = "coverage/coverage-summary.json";
            if (!fs.existsSync(path)) process.exit(0);
            const total = JSON.parse(fs.readFileSync(path, "utf8")).total;
            const rows = ["lines", "statements", "functions", "branches"]
              .map((k) => `| ${k} | ${total[k].pct}% |`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `### 前端测试覆盖率\n\n| 指标 | 覆盖率 |\n|---|---|\n${rows.join("\n")}\n`);
          '

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7
          if-no-files-found: warn

  # 前端依赖漏洞审计（不依赖 GHAS/依赖图，私有仓库可用；
  # 仓库转公开后可再上 actions/dependency-review-action 拦 license 问题）
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Audit (high/critical)
        working-directory: frontend
        # 仅审计生产依赖的高危/致命漏洞；dev 依赖噪音大（构建期不进产物）
        run: pnpm audit --prod --audit-level high
