name: E2E (Playwright)

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'server/**'
      - '.github/workflows/e2e.yml'
      - 'frontend/playwright.config.ts'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'server/**'
      - '.github/workflows/e2e.yml'
      - 'frontend/playwright.config.ts'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # All env vars are explicit here. The .env file is NOT read in CI
    # (Settings reads os.environ first via Pydantic, but with env_file
    # set, Pydantic would still find the .env file in CWD. We avoid
    # that by writing our own .env.ci file that overwrites any
    # committed .env with the values below — see "Write CI env file" step).
    env:
      # Backend
      DATABASE_URL: sqlite:///./e2e-go.db
      SECRET_KEY: ci-secret-not-for-prod
      REDIS_URL: ''
      LATEX_CLSI_ENABLED: 'false'
      # The backend and in-process fake S3 server both run on the runner host.
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci-access
      S3_SECRET_KEY: ci-secret
      S3_BUCKET: papersage
      S3_REGION: us-east-1
      # If a spec ever needs to hand a presigned URL to the browser, this
      # is the host the browser sees. Mirrors S3_ENDPOINT for CI.
      S3_PUBLIC_URL: http://localhost:9000
      EMAIL_PROVIDER: smtp
      SMTP_HOST: localhost
      # Frontend
      # The frontend reads VITE_API_BASE_URL (not VITE_API_BASE) — see
      # frontend/src/lib/env.ts. Using an absolute URL bypasses the Vite
      # dev proxy so multipart uploads and binary responses don't get
      # double-buffered. CORS in the backend allows * origins.
      VITE_API_BASE_URL: http://localhost:5478
      # Playwright
      CI: 'true'
      PLAYWRIGHT_BASE_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      # ── Backend (Go) setup ────────────────────────────────
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # Use the repository's in-process S3 test server so CI does not depend
      # on anonymous access to an external container registry.
      - name: Start fake S3
        working-directory: server
        run: |
          mkdir -p bin "$GITHUB_WORKSPACE/logs"
          go build -o bin/fakes3 ./cmd/fakes3
          nohup ./bin/fakes3 --addr :9000 --bucket papersage \
            > "$GITHUB_WORKSPACE/logs/fakes3.log" 2>&1 &
          echo $! > /tmp/fakes3.pid
          for i in {1..30}; do
            if curl -sf http://localhost:9000/ >/dev/null 2>&1; then
              echo "Fake S3 ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Fake S3 did not start in 30s"
          cat "$GITHUB_WORKSPACE/logs/fakes3.log" || true
          exit 1

      # ── Frontend setup ────────────────────────────────────
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # ── Write CI env file（Go config 读取的 .env）─────────
      - name: Write CI env file
        working-directory: server
        run: |
          cat > .env <<ENVEOF
          DATABASE_URL=sqlite:///./e2e-go.db
          SECRET_KEY=ci-secret-not-for-prod
          REDIS_URL=
          LATEX_CLSI_ENABLED=false
          S3_ENDPOINT=http://localhost:9000
          S3_ACCESS_KEY=ci-access
          S3_SECRET_KEY=ci-secret
          S3_BUCKET=papersage
          S3_REGION=us-east-1
          S3_PUBLIC_URL=http://localhost:9000
          EMAIL_PROVIDER=smtp
          SMTP_HOST=localhost
          ENVEOF

      # ── Seed e2e DB ───────────────────────────────────────
      - name: Build & seed (go)
        working-directory: server
        run: |
          mkdir -p "$GITHUB_WORKSPACE/logs"
          go build -o bin/papersage ./cmd/papersage
          go run ./cmd/seed 2>&1 | tee "$GITHUB_WORKSPACE/logs/seed.log"

      # ── Start backend ─────────────────────────────────────
      - name: Start backend (go binary)
        working-directory: server
        run: |
          nohup ./bin/papersage > "$GITHUB_WORKSPACE/logs/backend.log" 2>&1 &
          echo $! > /tmp/backend.pid
          disown

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:5478/health >/dev/null; then
              echo "Backend ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not start in 60s"
          tail -100 "$GITHUB_WORKSPACE/logs/backend.log" || true
          exit 1

      # ── Start frontend ────────────────────────────────────
      - name: Start vite dev server
        working-directory: frontend
        run: |
          nohup pnpm dev --host 127.0.0.1 --port 5173 --strictPort \
            > "$GITHUB_WORKSPACE/logs/frontend.log" 2>&1 &
          echo $! > /tmp/frontend.pid
          disown

      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:5173/ >/dev/null; then
              echo "Frontend ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Frontend did not start in 60s"
          tail -100 "$GITHUB_WORKSPACE/logs/frontend.log" || true
          exit 1

      # ── Playwright ────────────────────────────────────────
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E
        id: e2e
        working-directory: frontend
        # The reporter set lives in playwright.config.ts (keyed on
        # process.env.CI) and includes list, github, html, json. Don't
        # pass --reporter on the CLI — it OVERRIDES the config and
        # we'd lose the html/json artifacts.
        run: pnpm exec playwright test
        env:
          CI: 'true'

      # ── Artifacts ─────────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/playwright-results.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload test results (traces, videos, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: frontend/test-results
          retention-days: 7
          if-no-files-found: warn

      - name: Upload backend & frontend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: logs
          retention-days: 7
          if-no-files-found: warn

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo '── seed.log ──'
          tail -100 "$GITHUB_WORKSPACE/logs/seed.log" 2>/dev/null || echo "(missing)"
          echo '── backend.log ──'
          tail -200 "$GITHUB_WORKSPACE/logs/backend.log" 2>/dev/null || echo "(missing)"
          echo '── frontend.log ──'
          tail -200 "$GITHUB_WORKSPACE/logs/frontend.log" 2>/dev/null || echo "(missing)"

      - name: Cleanup e2e db
        if: always()
        working-directory: server
        run: rm -f e2e-go.db .env bin/papersage bin/fakes3

  # ── 真实 LaTeX 编译链路（TinyTeX 容器）─────────────────
  # 手动/周期触发：构建 Dockerfile.ci（TinyTeX ~700MB）跑 CLSI，
  # 验证「编辑→编译→PDF」全链路。不阻塞普通 PR。
  clsi:
    name: E2E + real CLSI (TinyTeX)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: sqlite:///./e2e-clsi.db
      SECRET_KEY: ci-secret-not-for-prod
      LATEX_CLSI_ENABLED: 'true'
      LATEX_CLSI_BASE_URL: http://localhost:3013
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci-access
      S3_SECRET_KEY: ci-secret
      S3_BUCKET: papersage
      S3_REGION: us-east-1
      VITE_API_BASE_URL: http://localhost:5478
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Start fake S3
        working-directory: server
        run: |
          mkdir -p bin
          go build -o bin/fakes3 ./cmd/fakes3
          nohup ./bin/fakes3 --addr :9000 --bucket papersage >/tmp/fakes3-clsi.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://localhost:9000/ >/dev/null; then
              echo "Fake S3 ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Fake S3 did not start in 30s"
          cat /tmp/fakes3-clsi.log || true
          exit 1

      - name: Build TinyTeX CLSI image
        run: docker build -f latex_render/Dockerfile.ci -t papersage-render-ci latex_render

      - name: Start CLSI
        run: |
          # LISTEN_ADDRESS 必须显式传入（settings 模块默认绑 127.0.0.1，
          # Dockerfile 内已设但双保险），否则端口映射够不着
          docker run -d --name clsi -p 3013:3013             -e LISTEN_ADDRESS=0.0.0.0 -e PORT=3013 papersage-render-ci
          for i in {1..90}; do
            if curl -sf http://localhost:3013/status >/dev/null; then
              echo "CLSI ready after $((i*2))s"; exit 0
            fi
            sleep 2
          done
          echo "── docker ps:"; docker ps -a --filter name=clsi
          echo "── full clsi logs:"
          docker logs clsi 2>&1 | grep -v statfs | tail -120
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build & seed backend
        working-directory: server
        run: |
          go build -o bin/papersage ./cmd/papersage
          go run ./cmd/seed

      - name: Start backend
        working-directory: server
        run: |
          nohup ./bin/papersage > /tmp/backend.log 2>&1 &
          for i in {1..60}; do
            curl -sf http://127.0.0.1:5478/health >/dev/null && exit 0
            sleep 1
          done
          tail -50 /tmp/backend.log; exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          nohup pnpm dev --host 127.0.0.1 --port 5173 --strictPort > /tmp/frontend.log 2>&1 &
          for i in {1..60}; do
            curl -sf http://127.0.0.1:5173/ >/dev/null && exit 0
            sleep 1
          done
          tail -50 /tmp/frontend.log; exit 1

      - name: Run Playwright (CLSI specs)
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium && pnpm exec playwright test writing/compile-real.spec.ts
        env:
          RUN_CLSI_E2E: '1'
          E2E_USER: e2euser
          E2E_PASS: e2epass1
          E2E_PROJECT_ID: 22222222-2222-2222-2222-222222222222
