name: Quality

# 开源工程规范门禁：PR 标题、文档断链、依赖许可证。
# 三个 job 都远短于 E2E 的 7 分钟关键路径，并行跑不会拉长 PR 总时长，
# 因此不做 paths 过滤——过滤本身还要额外引一个 paths-filter action。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 每周一 03:29 UTC：只在这时才检查外链（PR 上只做离线相对链接检查）
    - cron: '29 3 * * 1'
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    steps:
      # 只校验类型前缀，中文标题不受影响。
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  links:
    name: links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # PR/push 只查仓库内相对链接，避免外链抖动把日常 PR 判红。
      - name: Check links (offline)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config .lychee.toml --no-progress --offline --exclude 'docs/agents/handoff-.*'
            README.md AGENTS.md CONTRIBUTING.md SECURITY.md docs
      # 定时/手动才跑全量外链；失败不阻塞任何 PR。
      - name: Check links (external)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config .lychee.toml --no-progress --max-retries 2 --accept 200,206,429
            --exclude 'docs/agents/handoff-.*'
            README.md AGENTS.md CONTRIBUTING.md SECURITY.md docs

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install go-licenses
        run: |
          go install github.com/google/go-licenses/v2@v2.0.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check dependency licenses
        run: bash scripts/check-licenses.sh
