name: Docker Build & Push

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.dockerignore'
      - '.github/workflows/docker.yml'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    # 只剩 API-only 镜像：CLSI/render 服务已删除，编译走浏览器 WASM。
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/papersage-server:latest
          cache-from: type=gha,scope=papersage-server
          cache-to: type=gha,scope=papersage-server,mode=max
          # 供应链证明：provenance（构建来源/SLSA）+ SBOM（组件清单）随镜像
          # 推送到 registry，docker buildx 原生 attestation
          provenance: mode=max
          sbom: true
