name: Docker Build & Push

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'frontend/**'
      - 'latex_render/**'
      - '.github/workflows/docker.yml'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      matrix:
        include:
          # 单二进制镜像（前端 embed）；上下文为仓库根（Dockerfile 需同时访问
          # frontend/ 与 server/）
          - context: .
            dockerfile: server/Dockerfile
            image: papersage-app
          - context: latex_render
            dockerfile: latex_render/Dockerfile
            image: papersage-render

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 供应链证明：provenance（构建来源/SLSA）+ SBOM（组件清单）随镜像
          # 推送到 registry，docker buildx 原生 attestation
          provenance: mode=max
          sbom: true
