# goreleaser — 单二进制交付：tag (v*) 触发，跨平台二进制 + checksums + GitHub Release
# 前端产物需在构建前嵌入 server/web/assets（构建时由前端 job 完成）。
version: 2

project_name: papersage

before:
  hooks:
    - go mod tidy

builds:
  - id: papersage
    main: ./cmd/papersage
    dir: server
    binary: papersage
    env: [CGO_ENABLED=0]
    # web/assets 由 release.yml 前置步骤填充（go:embed）
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ignore:
      # windows/arm64 暂无真实需求，减产物
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: binaries
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      # 无额外文件：单二进制自包含（前端已 embed）
      - none*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch
