# API-only binaries; frontend delivery is independent on Vercel.
version: 2

project_name: papersage

builds:
  - id: papersage
    main: ./cmd/papersage
    dir: server
    binary: papersage
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/0verL1nk/GraduateProject/server/internal/buildinfo.Version={{.Version}} -X github.com/0verL1nk/GraduateProject/server/internal/buildinfo.Commit={{.Commit}} -X github.com/0verL1nk/GraduateProject/server/internal/buildinfo.Date={{.Date}}
  - id: migrate
    main: ./cmd/migrate
    dir: server
    binary: migrate
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags: [-s -w]

archives:
  - id: binaries
    ids: [papersage, migrate]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - none*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch
